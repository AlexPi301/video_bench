server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 512m;

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /debug-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ^~ /debug-assets/ {
        alias /debug-assets/;
        add_header Cache-Control "no-store";
    }

    location ^~ /_mounted-files-internal/ {
        internal;
        alias /mounted-input/;
        add_header Cache-Control "no-store";
    }

    location ^~ /_impact-cycle-internal/ {
        internal;
        alias /data/impact-cycle/;
        add_header Cache-Control "no-store";
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flutter web plugins request package assets from /packages/, while release
    # builds place them under assets/packages/.
    location ^~ /packages/ {
        alias /usr/share/nginx/html/assets/packages/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|wasm|json|mp4|mov|m4v|webm|otf|ttf|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
